# Płytka: ESP32-S3 DevKitC-1 N16R8 (MON16R8)
# Piny zgodne z README: mikrofon sekcja 1_v5, głośnik sekcja 2_1, wyświetlacz sekcja 3.
esphome:
  name: voice-assistant
  friendly_name: voice-assistant
  on_boot:
    priority: -10
    then:
      - globals.set:
          id: va_state
          value: '0'
      # micro_wake_word startuje dopiero po połączeniu z Home Assistant
      # (voice_assistant -> on_client_connected)

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y

# Włączenie PSRAM - bez tego Wake Word nie zadziała!
psram:
  mode: octal
  speed: 80MHz

# Logi przez UART0 - płytka podłączona gniazdem "UART" (CH343, COM4)
logger:
  hardware_uart: UART0
  level: DEBUG # VERY_VERBOSE pokazuje wszystko, ale spowalnia ESP

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Voice-Assistant Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:

# ---------------------------------------------------------
# STAN ASYSTENTA (Globalna zmienna dla wyświetlacza)
# 0 = Idle (Czuwanie/WakeWord), 1 = Listening (Nasłuch),
# 2 = Thinking (Przetwarzanie), 3 = Speaking (Mówienie)
# ---------------------------------------------------------
globals:
  - id: va_state
    type: int
    restore_value: no
    initial_value: '0'

  # Wygaszacz "Matrix": ostatnia aktywność asystenta (millis) i wymuszenie z przycisku
  - id: last_active_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: matrix_force
    type: bool
    restore_value: no
    initial_value: 'false'

# Bez mowy przez 8 s od otwarcia mikrofonu (np. po pytaniu zwrotnym asystenta,
# gdy HA sam wznawia rozmowę) - przerwij nasłuch i wróć do czuwania
script:
  - id: listen_timeout
    mode: restart
    then:
      - delay: 8s
      - if:
          condition:
            lambda: 'return id(va_state) == 1;'
          then:
            - logger.log: "Brak mowy przez 8 s - koniec nasłuchu"
            - voice_assistant.stop:

# Po ilu sekundach bezczynności włączyć wygaszacz (0 = nigdy) - ustawiane z HA
number:
  - platform: template
    name: "Wygaszacz Matrix po"
    id: matrix_timeout
    icon: mdi:matrix
    entity_category: config
    unit_of_measurement: s
    mode: box
    min_value: 0
    max_value: 3600
    step: 30
    initial_value: 180
    optimistic: true
    restore_value: true

# ---------------------------------------------------------
# KONFIGURACJA AUDIO (I2S)
# ---------------------------------------------------------
i2s_audio:
  # Magistrala Mikrofonu (Input)
  - id: i2s_in
    i2s_lrclk_pin: GPIO4
    i2s_bclk_pin: GPIO5

  # Magistrala Głośnika (Output)
  - id: i2s_out
    i2s_lrclk_pin: GPIO7
    i2s_bclk_pin: GPIO8

microphone:
  - platform: i2s_audio
    id: board_microphone
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO6
    adc_type: external
    pdm: false
    channel: left # INMP441 (L/R zwarty do GND)
    bits_per_sample: 32bit
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: board_speaker
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO18
    dac_type: external
    channel: mono
    bits_per_sample: 16bit
    buffer_duration: 1000ms   # zapas na chwilowe opóźnienia pętli głównej
    timeout: 500ms

# ---------------------------------
# Przyciski testowe / debug
# ---------------------------------
rtttl:
  speaker: board_speaker
  id: my_rtttl
  gain: 0.8

button:
  - platform: template
    name: "Test RTTTL (Prawdziwy dźwięk)"
    on_press:
      - rtttl.play: "TwoBeeps:d=4,o=5,b=100:16e6,16e6"

  - platform: template
    name: "Wymuś Nasłuch (Debug)"
    on_press:
      - voice_assistant.start:

  - platform: template
    name: "Test wygaszacza Matrix"
    on_press:
      - globals.set:
          id: matrix_force
          value: 'true'

  - platform: restart
    name: "Restart"

# ---------------------------------------------------------
# LOGIKA ASYSTENTA GŁOSOWEGO I WAKE WORD
# ---------------------------------------------------------

# Definicja Wake Word (Wykrywanie hasła) - model pobierany automatycznie
micro_wake_word:
  id: wake_word_engine
  microphone: board_microphone
  models:
    # internal: HA nie widzi modelu, więc nie może go wyłączyć (set_configuration z pustą
    # listą aktywnych wake word wyłączało go i zapisywało ten stan we flashu).
    # Nowe id = nowy klucz w preferencjach, bez starego zapisanego "wyłączony".
    - model: github://esphome/micro-wake-word-models/models/v2/okay_nabu.json@main
      id: okay_nabu_local
      internal: true
  on_wake_word_detected:
    - logger.log: "Wake Word detected! Starting Assistant..."
    - globals.set:
        id: va_state
        value: '1' # Zmień oczy na ZIELONE (Listening)
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

# Główna konfiguracja Asystenta
voice_assistant:
  id: va
  microphone: board_microphone
  speaker: board_speaker
  micro_wake_word: wake_word_engine
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0

  # Słowo budzące wykrywamy dopiero, gdy HA jest połączony
  on_client_connected:
    - logger.log: "Połączono z Home Assistant - start wykrywania słowa budzącego"
    - micro_wake_word.enable_model: okay_nabu_local
    - micro_wake_word.start:

  on_client_disconnected:
    - logger.log: "Rozłączono z Home Assistant - stop wykrywania słowa budzącego"
    - voice_assistant.stop:
    - micro_wake_word.stop:
    - globals.set:
        id: va_state
        value: '0'

  on_listening:
    - logger.log: "Mikrofon aktywny - czekam na mowę..."
    - globals.set:
        id: va_state
        value: '1'
    - component.update: my_display
    - script.execute: listen_timeout

  # Zaczęto mówić - nie przerywaj nasłuchu
  on_stt_vad_start:
    - script.stop: listen_timeout

  # Wykryto mowę, zaczyna przetwarzać
  on_stt_end:
    - logger.log:
        format: "STT: %s"
        args: ['x.c_str()']
    - globals.set:
        id: va_state
        value: '2' # Zmień oczy na ŻÓŁTE (Thinking)
    - component.update: my_display

  # Asystent zaczyna mówić odpowiedź
  on_tts_start:
    - globals.set:
        id: va_state
        value: '3' # Zmień oczy na NIEBIESKIE + Usta (Speaking)
    - component.update: my_display

  # Koniec interakcji (sukces lub po błędzie)
  on_end:
    - delay: 1s
    - wait_until:
        condition:
          not:
            speaker.is_playing:
        timeout: 15s # bez tego asystent może "zawisnąć" na zawsze
    - globals.set:
        id: va_state
        value: '0' # Wróć do mrugania (Idle)
    - component.update: my_display
    - if:
        condition:
          and:
            - api.connected:
            - not:
                micro_wake_word.is_running:
        then:
          - micro_wake_word.start:

  # Błąd (np. brak sieci, brak STT) - wznowienie robi on_end
  on_error:
    - logger.log:
        format: "Błąd asystenta: %s - %s"
        args: ['code.c_str()', 'message.c_str()']
        level: ERROR
    - globals.set:
        id: va_state
        value: '0'
    - component.update: my_display

# ---------------------------------------------------------
# WYŚWIETLACZ I GRAFIKA (TWARZ) (ILI9xxx - GC9A01A)
# ---------------------------------------------------------
spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  interface: hardware

output:
  - platform: ledc
    pin: GPIO14
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: display_backlight
    restore_mode: ALWAYS_ON

font:
  - file: "gfonts://Roboto@700"
    id: font_main
    size: 20
    glyphs: " .!?:0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzĄĆĘŁŃÓŚŹŻąćęłńóśźż"

  # Wygaszacz "Matrix" - znaki muszą zgadzać się z MATRIX_SYM w lambdzie wyświetlacza
  - file:
      type: gfonts
      family: Share Tech Mono
    id: font_matrix
    size: 14
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#*+<>=&%@"

display:
  - platform: ili9xxx
    model: GC9A01A
    id: my_display
    cs_pin: GPIO10
    dc_pin: GPIO9
    reset_pin: GPIO13
    invert_colors: true
    rotation: 0
    setup_priority: -100.0
    # Lambda rysuje tylko to, co się zmieniło (bez it.fill() co klatkę), więc gdy
    # twarz stoi, przez SPI nie idzie nic - 50 ms daje płynne mruganie bez obciążenia.
    update_interval: 50ms
    # Nie czyść bufora przed lambdą - lambda sama wymazuje tylko zmienione fragmenty
    auto_clear_enabled: false

    lambda: |-
          // ===== Twarz robota w stylu EMO/Cozmo: oczy-pastylki =====
          // Stany: 0 = czuwanie, 1 = słucham, 2 = myślę, 3 = mówię
          int state = id(va_state);
          uint32_t now = millis();

          // --- Aktywność i wygaszacz "Matrix" ---
          // Każdy stan inny niż czuwanie liczy się jako aktywność i wyłącza wygaszacz.
          if (state != 0) {
            id(last_active_ms) = now;
            id(matrix_force) = false;
          }
          uint32_t idle_ms = (uint32_t) id(matrix_timeout).state * 1000;
          bool matrix = state == 0 && (id(matrix_force) ||
              (idle_ms > 0 && now - id(last_active_ms) > idle_ms));

          // Zmiana trybu (twarz <-> Matrix) czyści cały ekran raz i wymusza pełne przerysowanie
          static bool was_matrix = false;
          static bool face_valid = false;
          if (matrix != was_matrix) {
            it.fill(Color(0, 0, 0));
            was_matrix = matrix;
            face_valid = false;
          }

          if (matrix) {
            // Krok deszczu co 150 ms - niezależnie od częstotliwości odświeżania
            static uint32_t last_step = 0;
            if (now - last_step < 150) return;   // brak zmian = brak transferu SPI
            last_step = now;
            it.fill(Color(0, 0, 0));

            static const char *MATRIX_SYM = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#*+<>=&%@";
            const int CW = 12, CH = 14;           // komórka znaku (px)
            const int COLS = 20, ROWS = 18;       // 240/12 kolumn, 240/14 (+1) wierszy
            static char cells[COLS][ROWS];
            static float head[COLS], speed[COLS];
            static int trail[COLS];
            static bool ready = false;
            int nsym = strlen(MATRIX_SYM);

            auto reset_column = [&](int c, bool anywhere) {
              head[c] = anywhere ? (float) (random_uint32() % (ROWS + 10)) - 10
                                 : -(float) (random_uint32() % 12);
              speed[c] = 0.5f + (random_uint32() % 70) / 100.0f;   // 0.5-1.2 wiersza/krok
              trail[c] = 6 + random_uint32() % 10;                   // 6-15 znaków
            };
            if (!ready) {
              for (int c = 0; c < COLS; c++) {
                for (int r = 0; r < ROWS; r++) cells[c][r] = MATRIX_SYM[random_uint32() % nsym];
                reset_column(c, true);
              }
              ready = true;
            }
            // Kilka znaków co krok zmienia się losowo, jak w filmie
            for (int i = 0; i < 12; i++)
              cells[random_uint32() % COLS][random_uint32() % ROWS] = MATRIX_SYM[random_uint32() % nsym];

            char buf[2] = {0, 0};
            for (int c = 0; c < COLS; c++) {
              int h = (int) head[c];
              for (int k = 0; k <= trail[c]; k++) {
                int r = h - k;
                if (r < 0 || r >= ROWS) continue;
                // Głowa jasnozielona, ogon coraz ciemniejszy
                Color cc = k == 0 ? Color(190, 255, 190)
                                  : Color(0, 255 - (k * 200) / trail[c], 40 - (k * 40) / trail[c]);
                buf[0] = cells[c][r];
                it.print(c * CW + CW / 2, r * CH, id(font_matrix), cc, TextAlign::TOP_CENTER, buf);
              }
              head[c] += speed[c];
              if (h - trail[c] > ROWS) reset_column(c, false);
            }
            return;
          }

          // Podczas słuchania i mówienia główna pętla przesyła dźwięk - rysuj co 100 ms
          static uint32_t last_face = 0;
          if ((state == 1 || state == 3) && face_valid && now - last_face < 100) return;
          last_face = now;

          // --- Parametry docelowe dla stanu ---
          const int CX = 120, EYE_Y = 100, EYE_DX = 50, MOUTH_Y = 172;
          float tw = 56, th = 72;          // szerokość / wysokość oka
          float tlid = 0;                  // skośna powieka (zmrużenie), px
          Color col = Color(225, 240, 255);
          switch (state) {
            case 1: tw = 62; th = 86; col = Color(40, 235, 110); break;        // słucham: szeroko otwarte
            case 2: tw = 58; th = 62; tlid = 18; col = Color(255, 205, 40); break; // myślę: zmrużone
            case 3: tw = 56; th = 68; col = Color(70, 160, 255); break;        // mówię
          }

          // --- Spojrzenie: szybkie, płynne skoki wzroku (sakady) ---
          static float gx = 0, gy = 0, tgx = 0, tgy = 0;
          static uint32_t next_gaze = 0;
          if (state == 0) {
            if (now >= next_gaze) {
              bool center = random_uint32() % 3 == 0;
              tgx = center ? 0 : (int) (random_uint32() % 29) - 14;
              tgy = center ? 0 : (int) (random_uint32() % 17) - 8;
              next_gaze = now + 1200 + random_uint32() % 3800;
            }
          } else if (state == 2) {
            // Myślenie: wzrok w górę, przeskakuje między stronami
            tgx = ((now / 900) % 2) ? 12 : -8;
            tgy = -10;
          } else {
            tgx = 0; tgy = state == 1 ? -4 : 0;
            next_gaze = now + 800;   // po powrocie do czuwania chwilę patrz prosto
          }
          gx += (tgx - gx) * 0.45f;
          gy += (tgy - gy) * 0.45f;

          // --- Płynna zmiana kształtu między stanami ---
          static float w = 56, h = 72, lid = 0;
          w += (tw - w) * 0.35f;
          h += (th - h) * 0.35f;
          lid += (tlid - lid) * 0.35f;

          // --- Mruganie: 160 ms, losowo co 2-6 s, czasem podwójne ---
          static uint32_t next_blink = 3000, blink_start = 0;
          if (now >= next_blink) {
            blink_start = now;
            bool twice = random_uint32() % 6 == 0;
            next_blink = now + (twice ? 320 : 2000 + random_uint32() % 4000);
            if (state == 1) next_blink += 3000;   // słuchając mruga rzadziej
          }
          float open = 1.0f;
          uint32_t bt = now - blink_start;
          if (bt < 160) open = fabsf(1.0f - 2.0f * bt / 160.0f);

          // --- Usta: tylko przy mówieniu, nieregularny rytm sylab ---
          static float mh = 0;
          static float mt = 0;
          static uint32_t next_syl = 0;
          if (state == 3) {
            if (now >= next_syl) {
              mt = random_uint32() % 4 == 0 ? 3 : 6 + random_uint32() % 22;   // czasem pauza
              next_syl = now + 80 + random_uint32() % 120;
            }
          } else {
            mt = 0;
          }
          mh += (mt - mh) * 0.5f;

          // --- Wskaźnik stanu pod oczami ---
          // słucham: 5 słupków "korektora", myślę: 3 kropki skaczące falą
          int ind_t = state == 1 ? 1 : (state == 2 ? 2 : 0);
          int iv[5] = {0, 0, 0, 0, 0};
          static float bar[5] = {0, 0, 0, 0, 0}, bar_t[5] = {0, 0, 0, 0, 0};
          static uint32_t next_bar = 0;
          if (ind_t == 1) {
            const float ENV[5] = {0.55f, 0.8f, 1.0f, 0.8f, 0.55f};   // środek najwyższy
            if (now >= next_bar) {
              for (int i = 0; i < 5; i++) bar_t[i] = ENV[i] * (6 + random_uint32() % 24);
              next_bar = now + 90 + random_uint32() % 60;
            }
            for (int i = 0; i < 5; i++) {
              bar[i] += (bar_t[i] - bar[i]) * 0.5f;
              iv[i] = std::max(4, (int) (bar[i] + 0.5f));
            }
          } else if (ind_t == 2) {
            for (int i = 0; i < 3; i++) {
              float ph = (now % 1100) / 1100.0f * 6.2832f - i * 0.9f;
              float s = sinf(ph);
              iv[i] = s > 0 ? (int) (s * 10 + 0.5f) : 0;   // wysokość podskoku
            }
          }

          // --- Klatka: wartości całkowite; identyczna z poprzednią = nic nie rysuj ---
          // Lekka perspektywa: oko po stronie spojrzenia jest odrobinę większe.
          int ew = (int) (w + 0.5f);
          int base_h = (int) (h * open + 0.5f);
          int lh = std::max(6, (int) (base_h * (1.0f - gx * 0.006f)));
          int rh = std::max(6, (int) (base_h * (1.0f + gx * 0.006f)));
          int ox = (int) lroundf(gx), oy = (int) lroundf(gy);
          int il = (int) (lid + 0.5f);
          int imh = (int) (mh + 0.5f);
          if (imh < 3) imh = 0;
          uint32_t icol = ((uint32_t) col.r << 16) | (col.g << 8) | col.b;

          // Oczy i dolna część (usta/wskaźnik) porównywane osobno: zmiana ust nie
          // przerysowuje oczu, więc przez SPI idzie tylko mały prostokąt.
          struct Eyes { int ox, oy, ew, lh, rh, il; uint32_t col; };
          struct Lower { int imh, ind_t, iv[5]; uint32_t col; };
          static Eyes pe = {};
          static Lower pl = {};
          Eyes ce = {ox, oy, ew, lh, rh, il, icol};
          Lower cl = {imh, ind_t, {iv[0], iv[1], iv[2], iv[3], iv[4]}, icol};
          bool eyes_dirty = !face_valid || memcmp(&ce, &pe, sizeof(Eyes)) != 0;
          bool lower_dirty = !face_valid || memcmp(&cl, &pl, sizeof(Lower)) != 0;
          if (!eyes_dirty && !lower_dirty) return;   // nic się nie zmieniło = brak transferu

          // Zaokrąglony prostokąt ("pastylka")
          auto pill = [&](int cx, int cy, int pw, int ph, int rad, Color c) {
            rad = std::min(rad, std::min(pw, ph) / 2);
            int x = cx - pw / 2, y = cy - ph / 2;
            it.filled_rectangle(x + rad, y, pw - 2 * rad, ph, c);
            it.filled_rectangle(x, y + rad, pw, ph - 2 * rad, c);
            it.filled_circle(x + rad, y + rad, rad, c);
            it.filled_circle(x + pw - rad - 1, y + rad, rad, c);
            it.filled_circle(x + rad, y + ph - rad - 1, rad, c);
            it.filled_circle(x + pw - rad - 1, y + ph - rad - 1, rad, c);
          };

          if (eyes_dirty) {
            if (face_valid) {
              int pmax_h = std::max(pe.lh, pe.rh);
              it.filled_rectangle(CX - EYE_DX - pe.ew / 2 + pe.ox - 2, EYE_Y + pe.oy - pmax_h / 2 - 2,
                                  2 * EYE_DX + pe.ew + 4, pmax_h + 4, Color(0, 0, 0));
            }
            int lx = CX - EYE_DX + ox, rx = CX + EYE_DX + ox, ey = EYE_Y + oy;
            pill(lx, ey, ew, lh, 18, col);
            pill(rx, ey, ew, rh, 18, col);
            // Zmrużenie: czarne trójkąty ścinają górę oczu skośnie ku środkowi twarzy
            if (il > 0) {
              int lt = ey - lh / 2 - 1, rt = ey - rh / 2 - 1;
              it.filled_triangle(lx - ew / 2 - 1, lt, lx + ew / 2 + 1, lt, lx + ew / 2 + 1, lt + il, Color(0, 0, 0));
              it.filled_triangle(rx - ew / 2 - 1, rt, rx + ew / 2 + 1, rt, rx - ew / 2 - 1, rt + il, Color(0, 0, 0));
            }
            pe = ce;
          }

          if (lower_dirty) {
            // Jeden stały obszar na usta i wskaźniki (poniżej oczu, bez nakładania)
            if (face_valid && (pl.imh > 0 || pl.ind_t > 0))
              it.filled_rectangle(CX - 36, MOUTH_Y - 24, 72, 44, Color(0, 0, 0));
            if (imh > 0) pill(CX, MOUTH_Y, 56, imh, 10, col);
            if (ind_t == 1) {
              // Słupki rosną symetrycznie od środkowej linii
              for (int i = 0; i < 5; i++)
                pill(CX - 28 + i * 14, MOUTH_Y, 8, iv[i], 4, col);
            } else if (ind_t == 2) {
              for (int i = 0; i < 3; i++)
                it.filled_circle(CX - 20 + i * 20, MOUTH_Y + 6 - iv[i], 6, col);
            }
            pl = cl;
          }

          face_valid = true;
