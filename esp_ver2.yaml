# Płytka: ESP32-S3 DevKitC-1 N16R8 (MON16R8)
# Piny zgodne z README: mikrofon sekcja 1_v5, głośnik sekcja 2_1, wyświetlacz sekcja 3.
esphome:
  name: voice-assistant
  friendly_name: voice-assistant
  on_boot:
    priority: -10
    then:
      - globals.set:
          id: va_state
          value: '0'
      # micro_wake_word startuje dopiero po połączeniu z Home Assistant
      # (voice_assistant -> on_client_connected)

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y

# Włączenie PSRAM - bez tego Wake Word nie zadziała!
psram:
  mode: octal
  speed: 80MHz

# Logi przez UART0 - płytka podłączona gniazdem "UART" (CH343, COM4)
logger:
  hardware_uart: UART0
  level: DEBUG # VERY_VERBOSE pokazuje wszystko, ale spowalnia ESP

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Voice-Assistant Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:

# ---------------------------------------------------------
# STAN ASYSTENTA (Globalna zmienna dla wyświetlacza)
# 0 = Idle (Czuwanie/WakeWord), 1 = Listening (Nasłuch),
# 2 = Thinking (Przetwarzanie), 3 = Speaking (Mówienie)
# ---------------------------------------------------------
globals:
  - id: va_state
    type: int
    restore_value: no
    initial_value: '0'

  # Wygaszacz "Matrix": ostatnia aktywność asystenta (millis) i wymuszenie z przycisku
  - id: last_active_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: matrix_force
    type: bool
    restore_value: no
    initial_value: 'false'

# Po ilu sekundach bezczynności włączyć wygaszacz (0 = nigdy) - ustawiane z HA
number:
  - platform: template
    name: "Wygaszacz Matrix po"
    id: matrix_timeout
    icon: mdi:matrix
    entity_category: config
    unit_of_measurement: s
    mode: box
    min_value: 0
    max_value: 3600
    step: 30
    initial_value: 180
    optimistic: true
    restore_value: true

# ---------------------------------------------------------
# KONFIGURACJA AUDIO (I2S)
# ---------------------------------------------------------
i2s_audio:
  # Magistrala Mikrofonu (Input)
  - id: i2s_in
    i2s_lrclk_pin: GPIO4
    i2s_bclk_pin: GPIO5

  # Magistrala Głośnika (Output)
  - id: i2s_out
    i2s_lrclk_pin: GPIO7
    i2s_bclk_pin: GPIO8

microphone:
  - platform: i2s_audio
    id: board_microphone
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO6
    adc_type: external
    pdm: false
    channel: left # INMP441 (L/R zwarty do GND)
    bits_per_sample: 32bit
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: board_speaker
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO18
    dac_type: external
    channel: mono
    bits_per_sample: 16bit
    buffer_duration: 500ms
    timeout: 500ms

# ---------------------------------
# Przyciski testowe / debug
# ---------------------------------
rtttl:
  speaker: board_speaker
  id: my_rtttl
  gain: 0.8

button:
  - platform: template
    name: "Test RTTTL (Prawdziwy dźwięk)"
    on_press:
      - rtttl.play: "TwoBeeps:d=4,o=5,b=100:16e6,16e6"

  - platform: template
    name: "Wymuś Nasłuch (Debug)"
    on_press:
      - voice_assistant.start:

  - platform: template
    name: "Test wygaszacza Matrix"
    on_press:
      - globals.set:
          id: matrix_force
          value: 'true'

  - platform: restart
    name: "Restart"

# ---------------------------------------------------------
# LOGIKA ASYSTENTA GŁOSOWEGO I WAKE WORD
# ---------------------------------------------------------

# Definicja Wake Word (Wykrywanie hasła) - model pobierany automatycznie
micro_wake_word:
  id: wake_word_engine
  microphone: board_microphone
  models:
    - model: github://esphome/micro-wake-word-models/models/v2/okay_nabu.json@main
  on_wake_word_detected:
    - logger.log: "Wake Word detected! Starting Assistant..."
    - globals.set:
        id: va_state
        value: '1' # Zmień oczy na ZIELONE (Listening)
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

# Główna konfiguracja Asystenta
voice_assistant:
  id: va
  microphone: board_microphone
  speaker: board_speaker
  micro_wake_word: wake_word_engine
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0

  # Słowo budzące wykrywamy dopiero, gdy HA jest połączony
  on_client_connected:
    - logger.log: "Połączono z Home Assistant - start wykrywania słowa budzącego"
    - micro_wake_word.start:

  on_client_disconnected:
    - logger.log: "Rozłączono z Home Assistant - stop wykrywania słowa budzącego"
    - voice_assistant.stop:
    - micro_wake_word.stop:
    - globals.set:
        id: va_state
        value: '0'

  on_listening:
    - logger.log: "Mikrofon aktywny - czekam na mowę..."
    - globals.set:
        id: va_state
        value: '1'
    - component.update: my_display

  # Wykryto mowę, zaczyna przetwarzać
  on_stt_end:
    - logger.log:
        format: "STT: %s"
        args: ['x.c_str()']
    - globals.set:
        id: va_state
        value: '2' # Zmień oczy na ŻÓŁTE (Thinking)
    - component.update: my_display

  # Asystent zaczyna mówić odpowiedź
  on_tts_start:
    - globals.set:
        id: va_state
        value: '3' # Zmień oczy na NIEBIESKIE + Usta (Speaking)
    - component.update: my_display

  # Koniec interakcji (sukces lub po błędzie)
  on_end:
    - delay: 1s
    - wait_until:
        condition:
          not:
            speaker.is_playing:
        timeout: 15s # bez tego asystent może "zawisnąć" na zawsze
    - globals.set:
        id: va_state
        value: '0' # Wróć do mrugania (Idle)
    - component.update: my_display
    - if:
        condition:
          and:
            - api.connected:
            - not:
                micro_wake_word.is_running:
        then:
          - micro_wake_word.start:

  # Błąd (np. brak sieci, brak STT) - wznowienie robi on_end
  on_error:
    - logger.log:
        format: "Błąd asystenta: %s - %s"
        args: ['code.c_str()', 'message.c_str()']
        level: ERROR
    - globals.set:
        id: va_state
        value: '0'
    - component.update: my_display

# ---------------------------------------------------------
# WYŚWIETLACZ I GRAFIKA (TWARZ) (ILI9xxx - GC9A01A)
# ---------------------------------------------------------
spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  interface: hardware

output:
  - platform: ledc
    pin: GPIO14
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: display_backlight
    restore_mode: ALWAYS_ON

font:
  - file: "gfonts://Roboto@700"
    id: font_main
    size: 20
    glyphs: " .!?:0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzĄĆĘŁŃÓŚŹŻąćęłńóśźż"

  # Wygaszacz "Matrix" - znaki muszą zgadzać się z MATRIX_SYM w lambdzie wyświetlacza
  - file:
      type: gfonts
      family: Share Tech Mono
    id: font_matrix
    size: 14
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#*+<>=&%@"

display:
  - platform: ili9xxx
    model: GC9A01A
    id: my_display
    cs_pin: GPIO10
    dc_pin: GPIO9
    reset_pin: GPIO13
    invert_colors: true
    rotation: 0
    setup_priority: -100.0
    # Kompromis: płynna animacja bez dławienia audio / wake word
    update_interval: 200ms

    lambda: |-
          // --- ZMIENNE ---
          int state = id(va_state);
          long now = millis();

          // Parametry twarzy (240x240)
          int cx = 120; // Środek X
          int cy = 100; // Wysokość oczu
          int eye_dist = 50; // Rozstaw oczu
          int eye_r = 25; // Promień oka

          Color col = Color(255, 255, 255);

          it.fill(Color(0, 0, 0));

          // --- WYGASZACZ "MATRIX" po bezczynności ---
          // Każdy stan inny niż Idle liczy się jako aktywność i wyłącza wygaszacz.
          if (state != 0) {
            id(last_active_ms) = now;
            id(matrix_force) = false;
          }
          uint32_t idle_ms = (uint32_t) id(matrix_timeout).state * 1000;
          bool matrix = state == 0 && (id(matrix_force) ||
              (idle_ms > 0 && (uint32_t) now - id(last_active_ms) > idle_ms));

          if (matrix) {
            static const char *MATRIX_SYM = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#*+<>=&%@";
            const int CW = 12, CH = 14;           // komórka znaku (px)
            const int COLS = 20, ROWS = 18;       // 240/12 kolumn, 240/14 (+1) wierszy
            static char cells[COLS][ROWS];
            static float head[COLS], speed[COLS];
            static int trail[COLS];
            static bool ready = false;
            int nsym = strlen(MATRIX_SYM);

            auto reset_column = [&](int c, bool anywhere) {
              head[c] = anywhere ? (float) (random_uint32() % (ROWS + 10)) - 10
                                 : -(float) (random_uint32() % 12);
              speed[c] = 0.5f + (random_uint32() % 70) / 100.0f;   // 0.5-1.2 wiersza/klatkę
              trail[c] = 6 + random_uint32() % 10;                   // 6-15 znaków
            };
            if (!ready) {
              for (int c = 0; c < COLS; c++) {
                for (int r = 0; r < ROWS; r++) cells[c][r] = MATRIX_SYM[random_uint32() % nsym];
                reset_column(c, true);
              }
              ready = true;
            }
            // Kilka znaków co klatkę zmienia się losowo, jak w filmie
            for (int i = 0; i < 12; i++)
              cells[random_uint32() % COLS][random_uint32() % ROWS] = MATRIX_SYM[random_uint32() % nsym];

            char buf[2] = {0, 0};
            for (int c = 0; c < COLS; c++) {
              int h = (int) head[c];
              for (int k = 0; k <= trail[c]; k++) {
                int r = h - k;
                if (r < 0 || r >= ROWS) continue;
                // Głowa jasnozielona, ogon coraz ciemniejszy
                Color cc = k == 0 ? Color(190, 255, 190)
                                  : Color(0, 255 - (k * 200) / trail[c], 40 - (k * 40) / trail[c]);
                buf[0] = cells[c][r];
                it.print(c * CW + CW / 2, r * CH, id(font_matrix), cc, TextAlign::TOP_CENTER, buf);
              }
              head[c] += speed[c];
              if (h - trail[c] > ROWS) reset_column(c, false);
            }
            return;
          }

          // --- MASZYNA STANÓW (ANIMACJE) ---

          // STAN 1: LISTENING (Nasłuch) -> Zielone, szerokie oczy
          if (state == 1) {
            col = Color(0, 255, 0); // ZIELONY
            eye_r = 35; // Powiększone
            it.filled_circle(cx - eye_dist, cy, eye_r, col);
            it.filled_circle(cx + eye_dist, cy, eye_r, col);

            it.print(cx, 180, id(font_main), col, TextAlign::CENTER, "Słucham...");
          }

          // STAN 2: THINKING (Myślenie) -> Żółte, skaczące oczy
          else if (state == 2) {
            col = Color(255, 255, 0); // ŻÓŁTY
            int offset = (int)(sin(now / 100.0) * 10);

            it.filled_circle(cx - eye_dist, cy + offset, eye_r, col);
            it.filled_circle(cx + eye_dist, cy - offset, eye_r, col); // Przeciwfaza

            it.print(cx, 180, id(font_main), col, TextAlign::CENTER, "Myślę...");
          }

          // STAN 3: SPEAKING (Mówienie) -> Niebieskie oczy + USTA
          else if (state == 3) {
            col = Color(50, 150, 255); // NIEBIESKI

            it.filled_circle(cx - eye_dist, cy, eye_r, col);
            it.filled_circle(cx + eye_dist, cy, eye_r, col);
            it.filled_circle(cx - eye_dist, cy, 10, Color(0, 0, 0));
            it.filled_circle(cx + eye_dist, cy, 10, Color(0, 0, 0));

            // Animacja ust (prostokąt zmieniający wysokość)
            int mouth_h = 5 + abs((int)(sin(now / 80.0) * 20));
            it.filled_rectangle(cx - 30, 160 - (mouth_h/2), 60, mouth_h, Color(255, 255, 255));
          }

          // STAN 0: IDLE (Czuwanie) -> Mruganie co 4 sekundy
          else {
            col = Color(255, 255, 255);
            // Okno 300ms, żeby mrugnięcie trafiło w odświeżanie co 200ms
            bool blink = (now % 4000 < 300);

            if (blink) {
              it.line(cx - eye_dist - 20, cy, cx - eye_dist + 20, cy, col);
              it.line(cx + eye_dist - 20, cy, cx + eye_dist + 20, cy, col);
            } else {
              it.filled_circle(cx - eye_dist, cy, eye_r, col);
              it.filled_circle(cx + eye_dist, cy, eye_r, col);
              it.filled_circle(cx - eye_dist, cy + 5, 8, Color(0, 0, 0));
              it.filled_circle(cx + eye_dist, cy + 5, 8, Color(0, 0, 0));
            }
          }
