<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 840" width="930" height="840" role="img" aria-label="Schemat połączeń asystenta głosowego ESP32-S3">
<style>
/* Układ: arkusz montażowy – schemat na całą szerokość, pod nim tabela pin-do-pinu i uwagi warsztatowe */
:root {
  --bg: #eef2ee;
  --paper: #fbfcfa;
  --fg: #17211b;
  --muted: #5a6a60;
  --rule: #cdd7cf;
  --board: #1d4a39;
  --board-ink: #e4f1e9;
  --can: #b9c3bd;
  --pad: #c9a43a;
  --w-v33: #cf3a2c;
  --w-v5: #d98500;
  --w-gnd: #2a302c;
  --w-mic: #2563d6;
  --w-amp: #8a43c8;
  --w-disp: #0b8f7a;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1411; --paper: #161d19; --fg: #e3ebe6; --muted: #92a399; --rule: #2b3830;
    --board: #1a3e31; --board-ink: #d7eadf; --can: #5f6b64; --pad: #d9b44a;
    --w-v33: #ff6a5c; --w-v5: #ffb03a; --w-gnd: #c3ccc6; --w-mic: #6c9dff; --w-amp: #bb8cf2; --w-disp: #39cdb3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1411; --paper: #161d19; --fg: #e3ebe6; --muted: #92a399; --rule: #2b3830;
  --board: #1a3e31; --board-ink: #d7eadf; --can: #5f6b64; --pad: #d9b44a;
  --w-v33: #ff6a5c; --w-v5: #ffb03a; --w-gnd: #c3ccc6; --w-mic: #6c9dff; --w-amp: #bb8cf2; --w-disp: #39cdb3;
  color-scheme: dark;
}


header { display: grid; gap: 6px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(28px, 4.4vw, 42px); line-height: 1.08; margin: 0; text-wrap: balance; }
.lead { margin: 0; max-width: 64ch; color: var(--muted); }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 20px; margin: 0 0 12px; }

.sheet { background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { width: 26px; height: 4px; border-radius: 2px; display: inline-block; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--w-v5) 0 6px, transparent 6px 10px); }
.scroll { overflow-x: auto; }


/* SVG */
.w { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.w.v33 { stroke: var(--w-v33); } .w.v5 { stroke: var(--w-v5); } .w.gnd { stroke: var(--w-gnd); }
.w.mic { stroke: var(--w-mic); } .w.amp { stroke: var(--w-amp); } .w.disp { stroke: var(--w-disp); }
.w.target { stroke-dasharray: 7 5; }
.dot.v33 { fill: var(--w-v33); } .dot.gnd { fill: var(--w-gnd); }
.pad { fill: var(--pad); stroke: var(--paper); stroke-width: 1.5; }
.pad.unused { fill: none; stroke: var(--muted); stroke-width: 1.2; opacity: .55; }
.board { fill: var(--board); }
.can { fill: var(--can); }
.cantext { fill: #1b211d; font-family: var(--f-mono); font-size: 13px; font-weight: 600; }
.cantext.small { font-size: 9.5px; font-weight: 500; }
.usb { fill: var(--can); stroke: var(--board); stroke-width: 2; }
.usblabel { fill: var(--fg); font-family: var(--f-mono); font-size: 12px; font-weight: 600; }
.usbsub { fill: var(--muted); font-family: var(--f-mono); font-size: 10px; }
.boardtitle { fill: var(--board-ink); font-family: var(--f-display); font-size: 17px; font-weight: 700; }
.boardsub { fill: var(--board-ink); opacity: .75; font-family: var(--f-mono); font-size: 10.5px; }
.elabel { fill: var(--board-ink); font-family: var(--f-mono); font-size: 12px; font-weight: 500; }
.elabel.unused { opacity: .45; }
.jumper rect { fill: var(--pad); }
.jlabel { fill: var(--w-v5); font-family: var(--f-mono); font-size: 11px; font-weight: 600; }
.tnote { fill: var(--w-v5); font-family: var(--f-body); font-size: 12px; font-weight: 500; }
.buslabel { font-family: var(--f-mono); font-size: 11px; font-weight: 600; }
.gndt { fill: var(--w-gnd); } .v33t { fill: var(--w-v33); }
.mbox { fill: var(--paper); stroke: var(--rule); stroke-width: 1.5; }
.mod.mic .mstripe { fill: var(--w-mic); } .mod.amp .mstripe { fill: var(--w-amp); } .mod.disp .mstripe { fill: var(--w-disp); }
.mtitle { fill: var(--fg); font-family: var(--f-display); font-size: 16px; font-weight: 800; }
.msub { fill: var(--muted); font-family: var(--f-body); font-size: 12px; }
.plabel { fill: var(--fg); font-family: var(--f-mono); font-size: 12px; font-weight: 600; }
.pnote { fill: var(--muted); font-family: var(--f-mono); font-size: 10px; }
.speaker rect, .speaker path { fill: none; stroke: var(--muted); stroke-width: 1.6; }

</style>
<rect x="0" y="0" width="930" height="840" rx="14" style="fill:var(--paper)"/>
<rect class="board" x="642" y="60" width="218" height="700" rx="12"/>
